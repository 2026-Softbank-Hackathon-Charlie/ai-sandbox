name: ci

# vet, gofmt, and the unit tests on every PR and on main. The tests that need a
# real cluster (build tag "cluster", see the README) are not run here.
# PRs reuse the Go module and build cache that main saves, and go test's own
# result cache skips packages whose inputs did not change.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOPRIVATE: github.com/2026-Softbank-Hackathon-Charlie
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v5

      # platform and migration-engine are private modules. MODULE_READ_TOKEN is
      # a repository secret: a fine-grained token with Contents read on both.
      - name: Private modules
        env:
          TOKEN: ${{ secrets.MODULE_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Repository secret MODULE_READ_TOKEN is not set (read access to platform and migration-engine)."
            exit 1
          fi
          # Self-hosted runners keep ~/.gitconfig between jobs: keep the token in this job's temp dir.
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${TOKEN}@github.com/2026-Softbank-Hackathon-Charlie/".insteadOf "https://github.com/2026-Softbank-Hackathon-Charlie/"

      - name: go.mod has no local replace
        run: |
          if grep -n '^replace .* => \.' go.mod; then
            echo "::error::go.mod points at a local checkout; require a pushed commit instead."
            exit 1
          fi

      # A self-hosted runner keeps ~/go between jobs; restoring over it races with parallel jobs.
      - name: Restore Go cache from main
        if: runner.environment == 'github-hosted'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-

      # The runner's own Go switches to the go.mod toolchain by itself
      # (GOTOOLCHAIN=auto); setup-go only runs when the runner has no Go at all.
      - name: Go toolchain
        id: go
        run: |
          if command -v go >/dev/null; then go version; else echo "missing=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v6
        if: steps.go.outputs.missing == 'true'
        with:
          go-version-file: go.mod
          cache: false

      # No -race yet: it has not been run against this repo (it needs cgo, which the
      # first author's machine lacks). Turn it on in a PR of its own if it passes.
      - name: Vet
        run: go vet ./...

      # gofmt of the go.mod toolchain, not the runner's own Go.
      - name: Formatting
        run: |
          unformatted="$("$(go env GOROOT)/bin/gofmt" -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"; exit 1
          fi

      # No -count=1: unchanged packages reuse their cached result.
      - name: Test
        run: go test ./...

      # A manual, tested main revision can be packaged without compiling on
      # the operator's Windows laptop or adding registry credentials to CI.
      - name: Build Linux release binary
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o dist/hopai ./cmd/hopai
          go version -m dist/hopai > dist/buildinfo.txt
          (cd dist && sha256sum hopai > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > dist/source-commit.txt

      - name: Upload tested release binary
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hopai-linux-amd64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

      # Only main saves, so a PR spends no time uploading.
      - name: Save Go cache
        if: runner.environment == 'github-hosted' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
